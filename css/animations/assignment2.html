<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
         .mainCont{
            background-color: rgb(49, 79, 109);

            width: 100%;
            
           
            height: 500px;
            display: inline-block;
          
            padding-top: 100px;
            padding-left: 100px;
        }

        #cont1:hover{

            #cont1-box2{
                transform: translate(30px, 30px);
            }

            #cont1-box3{
                transform: translate(60px, 60px);
            }

            /* #cont1-box2{

                transform: translate(0px 40px);

            }

            #cont1-box3{

                transform: translate(0px 60px);


            } */

        }

        #cont2:hover{

            #cont2-box1{
                transform: rotate(10deg);
            }
            #cont2-box2{

                transform: rotate(20deg);

    
            

            }

            #cont2-box3{
                transform: rotate(40deg);
            }
        }

        #cont3:hover{

            #cont3-box1{

            }

            #cont3-box2{
                transform: translate(-40px);

            }

            #cont3-box3{

                transform: translateX(-90px);

            }
        }

        

        .oneBox{
            height: 200px;
            width: 200px;
            position: absolute;
            transition: 1s;
            border-radius: 5px;
            
           
        }

        .secondBox{
            position: absolute;
            left: 500px;
            height: 200px;
            width: 200px;
            
            transform-origin: right bottom;
            transition: 1s;
            border-radius: 20px;
        }

        .thirdBox{
            position: absolute;
            right: 300px;
            height: 200px ; 
            width: 200px; 
            border-radius: 50%; 
            background-color: aliceblue;
            transition: 1s;
           
            
        }


    </style>
</head>
<body>

    <div class="mainCont">

        <div class="section" id="cont1">
            <div class="oneBox" id="cont1-box1" style="background-color: rgb(48, 156, 177) ; opacity: 0.6;"></div>
            <div class="oneBox" id="cont1-box2" style="background-color: rgb(48, 156, 177); opacity: 0.8;"> </div>
            <div class="oneBox" id="cont1-box3" style="background-color: rgb(48, 156, 177) ;"> </div>
        </div>

        <div class="section" id="cont2">
            <div class="secondBox"id="cont2-box1" style='background-color:rgb(184, 113, 223) ; opacity: 0.4 ;'></div>
            <div class="secondBox" id="cont2-box2" style="background-color: rgb(184, 113, 223); opacity: 0.6;"> </div>
            <div class="secondBox" id="cont2-box3" style="background-color: rgb(184, 113, 223);"> </div>

        </div>


        <div class="section" id="cont3">

            <div id="cont3-box1" class="thirdBox" style="background-color: rgb(113, 220, 159); opacity: 0.4;"></div>
            <div id="cont3-box2" class="thirdBox" style="background-color: rgb(113, 220, 159); opacity: 0.6;">  </div>
            <div id="cont3-box3" class="thirdBox" style="background-color: rgb(113, 220, 159);"></div>

        </div>

      



    </div>
    
</body>
</html>
