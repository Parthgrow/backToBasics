<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .mainCont{
            height: fit-content;
            border: 2px solid black;
            width: 100%;

           

        }
        
        .secondBox{
            height: 150px;
            width: 150px;
            background-color: yellow;
            
            border-radius: 50% 5% 50% 5%;
            position: absolute;
            top: 200px;
            left: 600px;
            border : 10px solid orange ; 
            transition: 2s;
            transform-origin: left bottom;


            
        }

        #cont2:hover{

            

            #cont2-box1{


                transform: rotate(20deg);
                
                

            }

            #cont2-box2{


                transform: rotate(40deg);

               

            }

            #cont2-box3{

                

                transform: rotate(60deg);


            }

        }
    </style>
</head>
<body>

    <div class="mainCont">


        <div class="section" id="cont2" >

            <div class="secondBox" id="cont2-box1"></div>
            <div class="secondBox" id="cont2-box2"></div>
            <div class="secondBox" id="cont2-box3"></div>

        </div>


        <div class="section" id="cont3">

            <div class="thirdBox" id="cont3-box1">Box 1</div>
            <div class="thirdBox" id="cont3-box2">Box 2</div>
            <div class="thirdBox" id="cont3-box3">Box 3</div>
            <div class="thirdBox" id="cont3-box4">Box 4</div>
            <div class="thirdBox" id="cont3-box5">Box 5</div>
            <div class="thirdBox" id="cont3-box6">Box 6</div>

        </div>



    </div>
    
</body>
</html>
