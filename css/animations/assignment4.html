<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background-image: linear-gradient(to right, rgb(45, 180, 198),rgb(176, 215, 221) );
        }
        .trafficBox{

            border : 2px solid black ; 
            height: 85vh;
            width: 15%;

            
            background-color: black;

            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            left: 600px;
            
           
            
        }

        #trafficStand{

            background-color: black;
            height: 100px;
            width: 100px;
            position: absolute;
            bottom: 20px;
            left: 660px;

        }

        .light{
            border : 2px solid white; 
            background-color: gray;
            border-radius : 50% ; 
            height: 150px;
            width: 150px;
            margin-top: 40px;


        }

        @keyframes lightOne { 
            0%{

                background-color: red

            }

            100%{

            }
        }

        @keyframes lightTwo{
            0%{
            }
            50%{
                background-color: yellow;
            }
            100%{

            }
        }

        @keyframes lightThree {

            0%{

            }
            100%{
                background-color: green;
            }
            
        }

        #light-1{

            animation-name: lightOne;
            animation-duration: 5s;
            animation-delay: 1s;
           
            

           

        }

        #light-2{

            animation-name: lightTwo;
            animation-duration: 5s;
            animation-delay: 3s;
            

        }

        #light-3{

            animation-name: lightThree;
            animation-duration: 5s;
            animation-delay: 6s;

        }
    </style>
</head>
<body>
     <!-- Building a traffic light  -->

     <div class="trafficBox" id="">

        <div class="light" id="light-1"> </div>
        <div class="light" id="light-2"> </div>
        <div class="light" id="light-3"> </div>
     </div>
     
     <div id="trafficStand">



     </div>
</body>
</html>
